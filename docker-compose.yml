services:
  api:
    build: .
    ports:
      - "80:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///kakitangan.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/employees"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  toolbox:
    build: .
    tty: true
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///kakitangan.db
    command: tail -f /dev/null

volumes:
  redis_data: